name: Ubuntu Cloud RDP1

on:
  workflow_dispatch:

# 仓库必须先配置 2 个 secrets（Settings → Secrets and variables → Actions）：
#   RDP_PASSWORD      —— RDP 登录密码（不要写在这里，不要带进日志）
#   TAILSCALE_AUTHKEY —— Tailscale 一次性 authkey（建议勾选 Ephemeral + 短过期时间）
# 说明：仅建议用于短期远程测试，勿当长期云电脑用（违反 GitHub 服务条款）。

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub 托管 runner 硬上限就是 360

    steps:
      - name: 1. Install XFCE Desktop & xRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-terminal xrdp dbus-x11 fcitx5 fcitx5-chinese-addons
          sudo adduser xrdp ssl-cert
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          ss -tlnp | grep 3389    # 确认 xrdp 已监听 3389

      - name: 2. Create Admin Account (password from secret)
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then echo "::error::Secret RDP_PASSWORD 未配置"; exit 1; fi
          # v2 修复：GitHub runner 镜像自带名为 admin 的组，
          # useradd 默认新建同名组会撞名报 exit 9，所以先确保组存在、再用 -g 复用
          getent group admin >/dev/null 2>&1 || sudo groupadd admin
          if id admin >/dev/null 2>&1; then
            echo "用户 admin 已存在，跳过创建"
          else
            sudo useradd -m -s /bin/bash -g admin -G sudo,adm admin
          fi
          echo "admin:$RDP_PASSWORD" | sudo chpasswd
          # xrdp 会话默认启动 XFCE 桌面
          echo "startxfce4" | sudo tee /home/admin/.xsession > /dev/null
          sudo chown admin:admin /home/admin/.xsession
          sudo -u admin -H dbus-launch --exit-with-session fcitx5-autostart >/dev/null 2>&1 || true
          echo "管理员账号 admin 已创建（密码不回显）"

      - name: 3. Install & Connect Tailscale (with retry)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then echo "::error::Secret TAILSCALE_AUTHKEY 未配置"; exit 1; fi
          curl -fsSL https://tailscale.com/install.sh | sh
          ok=false
          for try in 1 2 3; do
            if sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-rdp-server"; then
              ok=true; break
            fi
            echo "第 $try 次尝试失败，10 秒后重试..."
            sleep 10
          done
          [ "$ok" = true ] || { echo "::error::Tailscale 连接 3 次均失败"; exit 1; }

          ts_ip=$(sudo tailscale ip -4)
          [ -n "$ts_ip" ] || { echo "::error::未获取到 Tailscale IP"; exit 1; }
          echo ""
          echo "=========================================="
          echo "  RDP SERVER READY"
          echo "  Tailscale IP : $ts_ip"
          echo "  Username     : admin"
          echo "  Password     : (见 secrets.RDP_PASSWORD，不回显)"
          echo "  >> mstsc / Remmina 连接上面的 IP 即可（3389 端口）"
          echo "=========================================="

      - name: 4. Note about Chinese IME (微信输入法无 Linux 版)
        run: |
          echo "微信输入法没有 Linux 版（官方仅 iOS/Android/Windows/macOS 四端）。"
          echo "已预装 fcitx5 + 拼音：RDP 连上后，在输入法设置里选 fcitx5 并添加「Pinyin」即可中文输入。"

      - name: 5. Keep Server Alive
        timeout-minutes: 350        # 留 10 分钟余量
        run: |
          for i in $(seq 1 210); do          # 210 分钟 = 350 分钟
            sleep 60
            echo "[$i/210] Server running..."
          done
